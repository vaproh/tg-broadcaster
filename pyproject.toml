[project]
name = "tg-broadcaster"
version = "1.0.0"
description = "Self-hosted Telegram control bot that posts formatted messages from your own accounts to groups on a schedule."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vaproh", url = "https://github.com/vaproh" }]
keywords = ["telegram", "telethon", "broadcaster", "scheduler", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]
dependencies = ["telethon>=1.45,<2"]

[project.urls]
Homepage = "https://github.com/vaproh/tg-broadcaster"
Repository = "https://github.com/vaproh/tg-broadcaster"
Issues = "https://github.com/vaproh/tg-broadcaster/issues"
Changelog = "https://github.com/vaproh/tg-broadcaster/blob/main/CHANGELOG.md"

[tool.uv]
package = false
